networks:
  integration_network:
    external: true
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    pull_policy: always
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - integration_network  
    volumes:
      - ollama-data:/root/.ollama
      - /etc/ssl/certs:/etc/ssl/certs
        
  ollama-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: webui
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - integration_network
    
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - ollama-webui-data:/app/backend/data
      - /etc/ssl/certs:/etc/ssl/certs
    depends_on:
      - ollama
volumes:
  ollama-data:
  ollama-webui-data:
